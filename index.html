<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aman.ai search</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#10b981', // Emerald theme accent
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar for minimal feel */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen antialiased font-mono selection:bg-emerald-500/30 selection:text-emerald-300">

  <!-- Background Subtle Glow -->
  <div class="fixed inset-0 pointer-events-none flex justify-center">
    <div class="w-full max-w-4xl h-[300px] bg-gradient-to-b from-emerald-500/5 to-transparent blur-3xl"></div>
  </div>

  <main class="relative max-w-3xl mx-auto px-4 py-12 md:py-20 flex flex-col min-h-screen">
    
    <!-- Header -->
    <header class="mb-8 text-center space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-xs text-zinc-400 font-mono mb-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Index: aman-ai
      </div>
      <h1 class="text-3xl font-bold tracking-tight text-zinc-100">aman.ai search</h1>
      <p class="text-sm text-zinc-400">Search every section of Aman's AI Journal. Each result jumps straight to its section</p>
    </header>

    <!-- Search Input Box -->
    <div class="sticky top-6 z-20 mb-6 backdrop-blur-md bg-zinc-950/80 rounded-2xl p-1">
      <div class="relative flex items-center bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl focus-within:border-emerald-500/60 focus-within:ring-2 focus-within:ring-emerald-500/20 transition-all duration-200">
        <!-- Search Icon -->
        <svg class="w-5 h-5 text-zinc-500 ml-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>

        <!-- Input Field -->
        <input 
          id="search-input" 
          type="text" 
          placeholder="Type to search..." 
          autofocus 
          autocomplete="off"
          class="w-full bg-transparent py-4 px-3 text-base text-zinc-100 placeholder-zinc-500 focus:outline-none font-mono"
        />

        <!-- Clear Button -->
        <button id="clear-btn" class="hidden mr-2 p-1 text-zinc-500 hover:text-zinc-300 rounded-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>

        <!-- KBD Hint Badge -->
        <div class="hidden sm:flex items-center gap-1 mr-4">
          <kbd class="px-2 py-1 text-[10px] font-mono font-semibold text-zinc-400 bg-zinc-800 border border-zinc-700/60 rounded shadow-sm">Ctrl</kbd>
          <kbd class="px-2 py-1 text-[10px] font-mono font-semibold text-zinc-400 bg-zinc-800 border border-zinc-700/60 rounded shadow-sm">K</kbd>
        </div>
      </div>
    </div>

    <!-- Search Stats / Info Bar -->
    <div id="stats" class="hidden mb-4 px-1 flex items-center justify-between text-xs text-zinc-500 font-mono">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Results Container -->
    <div id="results" class="space-y-3 flex-1">
      <!-- Initial State -->
      <div id="empty-state" class="text-center py-16 px-4 rounded-xl border border-dashed border-zinc-800/80 bg-zinc-900/20">
        <svg class="w-10 h-10 text-zinc-700 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
        <p class="text-sm text-zinc-400 font-medium">Start typing to search your Meilisearch index</p>
        <p class="text-xs text-zinc-600 mt-1">Press <kbd class="text-zinc-400">Ctrl + K</kbd> anytime to jump to search bar</p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="mt-12 py-6 border-t border-zinc-900 text-center text-xs text-zinc-600 flex justify-between items-center font-mono">
      <span>Connected to <code class="text-zinc-500">https://adhi.isroot.in</code></span>
      <span>Press <kbd class="px-1 py-0.5 bg-zinc-900 border border-zinc-800 rounded text-zinc-400">Esc</kbd> to exit input</span>
    </footer>

  </main>

  <!-- Script logic -->
  <script>
    const MEILI_HOST = 'https://adhi.isroot.in';
    const MEILI_KEY = 'barryallen@16';
    const INDEX_NAME = 'aman-ai';

    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-btn');
    const resultsContainer = document.getElementById('results');
    const statsContainer = document.getElementById('stats');

    let debounceTimer;

    // Debounced input handler
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value;
      
      if (query.trim().length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        performSearch(query);
      }, 150);
    });

    // Clear search
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      performSearch('');
      searchInput.focus();
    });

    // Global Hotkeys: Ctrl+K / Cmd+K and Esc
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }

      if (e.key === 'Escape') {
        if (document.activeElement === searchInput) {
          searchInput.blur();
        }
      }
    });

    // Perform Meilisearch API Query
    async function performSearch(query) {
      if (!query.trim()) {
        statsContainer.classList.add('hidden');
        resultsContainer.innerHTML = `
          <div id="empty-state" class="text-center py-16 px-4 rounded-xl border border-dashed border-zinc-800/80 bg-zinc-900/20">
            <svg class="w-10 h-10 text-zinc-700 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            <p class="text-sm text-zinc-400 font-medium">Start typing to search your Meilisearch index</p>
            <p class="text-xs text-zinc-600 mt-1">Press <kbd class="text-zinc-400">Ctrl + K</kbd> anytime to jump to search bar</p>
          </div>`;
        return;
      }

      const startTime = performance.now();

      try {
        const response = await fetch(`${MEILI_HOST}/indexes/${INDEX_NAME}/search`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${MEILI_KEY}`
          },
          body: JSON.stringify({
            q: query,
            limit: 20,
            attributesToHighlight: ['title', 'section_title', 'content'],
            attributesToCrop: ['content'],
            cropLength: 35,
            highlightPreTag: '<mark class="bg-emerald-500/20 text-emerald-300 font-medium rounded px-1">',
            highlightPostTag: '</mark>'
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP Error ${response.status}`);
        }

        const data = await response.json();
        const duration = Math.round(performance.now() - startTime);

        renderResults(data.hits, data.estimatedTotalHits || data.hits.length, duration);
      } catch (err) {
        console.error('Meilisearch fetch error:', err);
        statsContainer.classList.add('hidden');
        resultsContainer.innerHTML = `
          <div class="p-4 rounded-xl bg-red-950/30 border border-red-900/50 text-red-400 text-sm">
            Failed to fetch results from Meilisearch. Verify your host connection and master key.
          </div>`;
      }
    }

    // Render results into HTML
    function renderResults(hits, total, timeMs) {
      if (hits.length === 0) {
        statsContainer.classList.add('hidden');
        resultsContainer.innerHTML = `
          <div class="text-center py-12 text-zinc-500">
            <p class="text-sm font-medium">No results found matching your query</p>
          </div>`;
        return;
      }

      // Display Stats
      statsContainer.classList.remove('hidden');
      statsContainer.innerHTML = `
        <span>Found <strong class="text-zinc-300 font-semibold">${total}</strong> matching sections</span>
        <span>${timeMs}ms</span>
      `;

      // Render items
      resultsContainer.innerHTML = hits.map(hit => {
        const title = hit._formatted?.section_title || hit.section_title || hit.title;
        const parentTitle = hit._formatted?.title || hit.title;
        const snippet = hit._formatted?.content || hit.content;
        const targetUrl = hit.url || hit.page_url;
        const pathList = (hit.section_path || []).filter(p => p !== hit.section_title).join(' › ');

        return `
          <article class="group relative p-4 rounded-xl bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-700 hover:bg-zinc-900 transition-all duration-150 font-mono">
            <div class="flex items-start justify-between gap-4">
              <div class="space-y-1">
                <!-- Breadcrumb Path -->
                <div class="text-[11px] text-zinc-500 flex items-center gap-1.5 flex-wrap">
                  <span class="text-emerald-400/90 font-medium">${parentTitle}</span>
                  ${pathList ? `<span>›</span><span class="truncate max-w-xs">${pathList}</span>` : ''}
                  ${hit.level ? `<span class="ml-1 px-1.5 py-0.2 text-[9px] rounded bg-zinc-800 text-zinc-400 uppercase font-mono">${hit.level}</span>` : ''}
                </div>
                
                <!-- Section Title -->
                <h2 class="text-base font-semibold text-zinc-100 group-hover:text-emerald-400 transition-colors">
                  <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="focus:outline-none">
                    <span class="absolute inset-0"></span>
                    ${title}
                  </a>
                </h2>
              </div>

              <!-- External Link Icon -->
              <svg class="w-4 h-4 text-zinc-600 group-hover:text-zinc-300 flex-shrink-0 transition-colors mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
              </svg>
            </div>

            <!-- Content Snippet -->
            <p class="mt-2.5 text-xs text-zinc-400 leading-relaxed line-clamp-3 font-normal">
              ${snippet}
            </p>
          </article>
        `;
      }).join('');
    }
  </script>
</body>
</html>
